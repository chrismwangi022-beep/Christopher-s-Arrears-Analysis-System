name: Wake up Streamlit App

on:
  schedule:
    # This runs every 6 hours (4 times a day)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -I https://christopher-arrears-analysis-spread-capital.streamlit.app/