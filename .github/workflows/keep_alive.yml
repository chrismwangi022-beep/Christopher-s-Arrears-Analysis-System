name: Streamlit Wakeup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Force Wakeup
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
          -L --max-redirs 25 \
          "https://christopher-arrears-analysis-spread-capital.streamlit.app/"